# dailycheckin + 专用 GUI Chrome 容器
#
# 容器内跑: Xvfb 虚拟桌面 + Chromium(CDP 9333) + x11vnc + noVNC(6080)
#
# 首次使用 (tushare 图形验证码 / ldoh OAuth 需人工过一次):
#   1. docker compose -f docker/docker-compose.yml up -d --build
#   2. 浏览器打开 http://localhost:6080/vnc.html  (noVNC, 看到容器内 Chrome)
#   3. 在虚拟桌面的 Chrome 里手动登录 tushare.pro / ldoh.105117.xyz
#   4. cookie 存入 chrome-profile 命名卷, 之后自动复用
#
# 每日签到 (外部 cron/launchd 调用):
#   docker exec dailycheckin dailycheckin --include TUSHARE PKULAW LDOH
#
# 手动跑一次签到 (顺带):
#   docker compose ... run 时 command 传 sign (见 entrypoint.sh)

services:
  dailycheckin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: godlockin/dailycheckin:latest
    container_name: dailycheckin
    restart: always
    tty: true
    shm_size: "1gb"   # 避免 chromium 渲染 /dev/shm 不足
    ports:
      - "9333:9333"   # Chrome DevTools Protocol
      - "6080:6080"   # noVNC web 桌面
    environment:
      - DAILYCHECKIN_CDP_PORT=9333
      - TZ=Asia/Shanghai
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=900
      # - VNC_PASSWORD=改成你的密码    # 不设则无密码 (仅本机访问 6080)
    # 默认常驻 GUI 栈; 想启动即跑一次签到改成: command: ["sign"]
    command: []
    volumes:
      - ./config/:/dailycheckin/config/
      - ./logs/:/dailycheckin/logs/
      - ./cron/:/dailycheckin/cron/
      - chrome-profile:/dailycheckin/chrome-profile

volumes:
  chrome-profile: